[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/gemini/generate"
  to = "/.netlify/functions/gemini-generate"
  status = 200

[[redirects]]
  from = "/api/gemini/stream"
  to = "/.netlify/functions/gemini-stream"
  status = 200
